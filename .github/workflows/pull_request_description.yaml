name: PR Description Validation

on:
  pull_request:
    types: [opened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check PR Description Length
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Checks if body is null or shorter than 50 characters
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 50 ]; then
            echo "Error: PR description is too short (minimum 50 characters)."
            exit 1
          fi
